<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ahmedgram - Ultimate Network</title>

  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top left, #1a0b2e, #090514, #000000);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-size: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: rgba(18, 12, 38, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Auth Screen Overlay */
    .auth-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 5, 20, 0.95);
      backdrop-filter: blur(25px);
      z-index: 500;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
    }

    /* Header */
    .header {
      height: 60px;
      padding: 0 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
      z-index: 10;
    }

    .header-logo {
      font-size: 22px;
      font-weight: 800;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, #a855f7, #ec4899, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-icons i {
      font-size: 20px;
      margin-left: 16px;
      cursor: pointer;
      color: #e2e8f0;
    }

    /* Screens Container */
    .screen {
      flex: 1;
      overflow-y: auto;
      display: none;
      padding-bottom: 80px;
    }

    .screen.active { display: block; }
    .screen::-webkit-scrollbar { display: none; }

    /* Stories Bar */
    .stories-container {
      display: flex;
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      overflow-x: auto;
      gap: 14px;
      background: rgba(0, 0, 0, 0.2);
    }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 68px;
      cursor: pointer;
      position: relative;
    }

    .story-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #a855f7, #ec4899, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .story-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #0f0a1c;
    }

    .add-story-btn {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .story-username {
      font-size: 11px;
      margin-top: 5px;
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #cbd5e1;
    }

    /* Developer Badges & Frame */
    .dev-badge { color: #38bdf8; font-size: 12px; }
    .dev-tag { background: #0284c7; color: white; font-size: 9px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

    /* Post Card UI */
    .post-card {
      margin: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
    }

    .post-header {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      gap: 10px;
    }

    .post-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }

    .post-img { width: 100%; max-height: 400px; object-fit: cover; }

    .post-actions { display: flex; align-items: center; gap: 15px; padding: 10px 14px; font-size: 20px; }

    .post-likes-count { font-size: 12px; font-weight: bold; padding: 0 14px 6px; }

    .post-caption { font-size: 13px; padding: 0 14px 12px; color: #e2e8f0; }

    /* Story Fullscreen Viewer */
    .story-viewer-modal {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }

    .story-progress-bar { width: 100%; height: 3px; background: rgba(255, 255, 255, 0.3); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
    .story-progress-fill { height: 100%; width: 0%; background: #a855f7; }

    .story-viewer-header { display: flex; align-items: center; justify-content: space-between; z-index: 10; }
    .story-viewer-content { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .story-viewer-content img { width: 100%; height: 100%; object-fit: contain; }

    .story-footer-actions {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    /* Floating iOS Dock Navigation */
    .bottom-nav-container {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      height: 55px;
      background: rgba(22, 15, 41, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-icon { font-size: 20px; color: #94a3b8; cursor: pointer; transition: all 0.2s ease; }
    .nav-icon.active { color: #a855f7; transform: translateY(-2px) scale(1.15); }

    /* Forms & Inputs */
    .form-input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .neon-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .user-search-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      margin: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- Auth Screen Overlay -->
  <div id="authScreen" class="auth-overlay">
    <h2 class="header-logo" style="text-align: center; margin-bottom: 20px; font-size: 28px;">Ahmedgram</h2>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <input type="text" id="loginUsername" class="form-input" placeholder="اسم المستخدم (Username)">
      <input type="password" id="loginPassword" class="form-input" placeholder="كلمة المرور">
      <button onclick="loginUser()" class="neon-btn">تسجيل الدخول</button>
      <button onclick="registerUser()" class="neon-btn" style="background: rgba(255, 255, 255, 0.1);">إنشاء حساب جديد</button>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-logo">Ahmedgram</div>
    <div class="header-icons">
      <i class="fa-solid fa-plus-square" onclick="openCreatePostModal()" title="إضافة منشور"></i>
      <i class="fa-solid fa-paper-plane" onclick="switchTab('chatTab')"></i>
    </div>
  </div>

  <!-- Create Post Modal -->
  <div id="createPostModal" class="auth-overlay" style="display:none; z-index:600;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h3>إضافة منشور جديد 📸</h3>
      <i class="fa-solid fa-xmark" onclick="closeCreatePostModal()" style="font-size:20px; cursor:pointer;"></i>
    </div>
    <div style="display:flex; flex-direction:column; gap:12px;">
      <input type="file" id="postImageInput" accept="image/*" class="form-input">
      <textarea id="postCaptionInput" class="form-input" rows="3" placeholder="اكتب وصف المنشور..."></textarea>
      <button onclick="publishPost()" class="neon-btn">نشر الآن</button>
    </div>
  </div>

  <!-- Story Fullscreen Viewer -->
  <div id="storyViewer" class="story-viewer-modal">
    <div>
      <div class="story-progress-bar">
        <div id="storyProgressFill" class="story-progress-fill"></div>
      </div>
      <div class="story-viewer-header">
        <div style="display:flex; align-items:center; gap:10px;">
          <img id="storyViewerAvatar" src="" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">
          <span id="storyViewerUsername" style="font-weight:bold; font-size:13px;"></span>
        </div>
        <i class="fa-solid fa-xmark" onclick="closeStoryViewer()" style="font-size:22px; cursor:pointer;"></i>
      </div>
    </div>
    <div class="story-viewer-content">
      <img id="storyViewerImg" src="">
    </div>
    <div class="story-footer-actions">
      <div style="display:flex; align-items:center; gap:10px;">
        <i id="storyLikeBtn" class="fa-regular fa-heart" onclick="toggleStoryLike()" style="font-size:24px; color:#ec4899; cursor:pointer;"></i>
        <span id="storyLikesCount" style="font-size:12px;">0 لايك</span>
      </div>
    </div>
  </div>

  <!-- Screen 1: Feed -->
  <div id="homeTab" class="screen active">
    <div class="stories-container" id="storiesList">
      <div class="story-item">
        <div class="story-ring" id="myStoryRing" onclick="document.getElementById('storyFileInput').click()">
          <img src="https://via.placeholder.com/150" class="story-img" id="homeMyAvatar">
          <div class="add-story-btn">+</div>
        </div>
        <span class="story-username">قصتك</span>
        <input type="file" id="storyFileInput" accept="image/*" style="display:none;" onchange="uploadStory(event)">
      </div>
    </div>

    <!-- Feed Posts Container -->
    <div id="feedList"></div>
  </div>

  <!-- Screen 2: Reels -->
  <div id="reelsTab" class="screen">
    <div style="padding: 20px; text-align: center;">
      <h3 style="color:#a855f7;">Ahmedgram Reels</h3>
      <p style="color:#94a3b8; font-size:13px;">تصفح مقاطع الفيديو القصيرة السريعة.</p>
    </div>
  </div>

  <!-- Screen 3: Private Chat -->
  <div id="chatTab" class="screen">
    <div style="padding:14px; font-weight:bold; font-family:'Orbitron';">المحادثات الخاصة (DM)</div>
    <div id="chatInboxList" style="padding:12px; text-align:center; color:#94a3b8; font-size:13px;">
      ابحث عن أي شخص واضغط "رسالة" لبدء شات خاص!
    </div>
  </div>

  <!-- Screen 4: Search -->
  <div id="searchTab" class="screen">
    <div style="padding: 16px;">
      <input type="text" id="searchInput" class="form-input" placeholder="بحث عن يوزر..." oninput="searchUsers()">
    </div>
    <div id="searchResults"></div>
  </div>

  <!-- Screen 5: Profile -->
  <div id="profileTab" class="screen">
    <div style="padding: 20px; text-align: center;">
      <div class="story-ring" style="width: 86px; height: 86px; margin: 0 auto;">
        <img id="profilePreview" src="https://via.placeholder.com/150" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
      </div>
      
      <div style="margin-top:12px; display:flex; align-items:center; justify-content:center; gap:6px;">
        <h3 id="myProfileUsername" style="color:#38bdf8;">@username</h3>
        <span id="devTagBadge" class="dev-tag" style="display:none;">Developer</span>
        <i id="devVerifiedBadge" class="fa-solid fa-circle-check dev-badge" style="display:none;"></i>
      </div>

      <!-- Followers Stats Bar -->
      <div style="display:flex; justify-content:space-around; margin:15px 0; background:rgba(255,255,255,0.03); padding:10px; border-radius:12px;">
        <div>
          <div id="followersCount" style="font-weight:bold; color:#a855f7;">0</div>
          <div style="font-size:11px; color:#94a3b8;">متابعون</div>
        </div>
        <div>
          <div style="font-weight:bold; color:#ec4899;">120</div>
          <div style="font-size:11px; color:#94a3b8;">يتابعهم</div>
        </div>
      </div>

      <textarea id="bioInput" class="form-input" rows="2" placeholder="البايو الخاص بك..."></textarea>
      <button onclick="saveProfile()" class="neon-btn" style="margin-top:15px;">حفظ التعديلات</button>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav-container">
    <i class="fa-solid fa-compass nav-icon active" onclick="switchTab('homeTab', this)"></i>
    <i class="fa-solid fa-play nav-icon" onclick="switchTab('reelsTab', this)"></i>
    <i class="fa-solid fa-message nav-icon" onclick="switchTab('chatTab', this)"></i>
    <i class="fa-solid fa-globe nav-icon" onclick="switchTab('searchTab', this)"></i>
    <i class="fa-solid fa-user-astronaut nav-icon" onclick="switchTab('profileTab', this)"></i>
  </div>

</div>

<!-- Firebase Modular SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = { databaseURL: "https://elsho3l-default-rtdb.firebaseio.com/" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentUserId = localStorage.getItem('ahmedgram_logged_user');
  let currentAvatar = "https://via.placeholder.com/150";
  let activeStoryKey = null;

  const DEV_USERNAME = "ahmed_ibrahim";

  // Auth Handling
  window.registerUser = () => {
    const user = document.getElementById('loginUsername').value.trim().toLowerCase();
    const pass = document.getElementById('loginPassword').value.trim();

    if (!user || !pass) return alert('أدخل اليوزر وكلمة السر');

    get(ref(db, 'users_db/' + user)).then((snap) => {
      if (snap.exists()) {
        alert('اسم المستخدم مأخوذ بالفعل!');
      } else {
        set(ref(db, 'users_db/' + user), {
          username: user,
          password: pass,
          bio: 'عضو في Ahmedgram',
          avatar: currentAvatar
        }).then(() => loginSuccess(user));
      }
    });
  };

  window.loginUser = () => {
    const user = document.getElementById('loginUsername').value.trim().toLowerCase();
    const pass = document.getElementById('loginPassword').value.trim();

    get(ref(db, 'users_db/' + user)).then((snap) => {
      if (snap.exists() && snap.val().password === pass) {
        loginSuccess(user);
      } else {
        alert('بيانات الدخول غير صحيحة!');
      }
    });
  };

  function loginSuccess(user) {
    currentUserId = user;
    localStorage.setItem('ahmedgram_logged_user', user);
    document.getElementById('authScreen').style.display = 'none';
    loadMyProfile();
    loadFeedPosts();
  }

  if (currentUserId) {
    document.getElementById('authScreen').style.display = 'none';
    loadMyProfile();
    loadFeedPosts();
  }

  // Load Profile and Dev Status
  function loadMyProfile() {
    get(ref(db, 'users_db/' + currentUserId)).then((snap) => {
      if (snap.exists()) {
        const data = snap.val();
        const isDev = (currentUserId === DEV_USERNAME);

        document.getElementById('myProfileUsername').innerText = '@' + data.username;
        document.getElementById('bioInput').value = data.bio || '';
        
        // Developer Customizations
        document.getElementById('devTagBadge').style.display = isDev ? 'inline' : 'none';
        document.getElementById('devVerifiedBadge').style.display = isDev ? 'inline' : 'none';
        document.getElementById('followersCount').innerText = isDev ? '41M' : '1.2K';

        if (data.avatar) {
          currentAvatar = data.avatar;
          document.getElementById('profilePreview').src = data.avatar;
          document.getElementById('homeMyAvatar').src = data.avatar;
        }
      }
    });
  }

  // Posts Feed Management
  window.openCreatePostModal = () => document.getElementById('createPostModal').style.display = 'flex';
  window.closeCreatePostModal = () => document.getElementById('createPostModal').style.display = 'none';

  window.publishPost = () => {
    const file = document.getElementById('postImageInput').files[0];
    const caption = document.getElementById('postCaptionInput').value.trim();

    if (!file) return alert('الرجاء اختيار صورة المنشور!');

    const reader = new FileReader();
    reader.onload = (e) => {
      push(ref(db, 'posts'), {
        username: currentUserId,
        avatar: currentAvatar,
        image: e.target.result,
        caption: caption,
        likes: 0,
        timestamp: Date.now()
      }).then(() => {
        closeCreatePostModal();
        loadFeedPosts();
      });
    };
    reader.readAsDataURL(file);
  };

  function loadFeedPosts() {
    onValue(ref(db, 'posts'), (snap) => {
      const feed = document.getElementById('feedList');
      feed.innerHTML = '';
      if (snap.exists()) {
        const posts = snap.val();
        Object.keys(posts).reverse().forEach(pId => {
          const p = posts[pId];
          const isDev = (p.username === DEV_USERNAME);

          const postEl = document.createElement('div');
          postEl.className = 'post-card';
          postEl.innerHTML = `
            <div class="post-header">
              <img src="${p.avatar || 'https://via.placeholder.com/150'}" class="post-avatar">
              <span style="font-weight:bold; font-size:13px; ${isDev ? 'color:#38bdf8;' : ''}">
                ${p.username} ${isDev ? '<span class="dev-tag">Developer</span> <i class="fa-solid fa-circle-check dev-badge"></i>' : ''}
              </span>
            </div>
            <img src="${p.image}" class="post-img">
            <div class="post-actions">
              <i class="fa-regular fa-heart" onclick="likePost('${pId}', this)" style="cursor:pointer; color:#ec4899;"></i>
              <i class="fa-regular fa-comment"></i>
            </div>
            <div class="post-likes-count"><span id="likes_${pId}">${p.likes || 0}</span> إعجاب</div>
            <div class="post-caption"><span style="font-weight:bold;">${p.username}</span> ${p.caption || ''}</div>
          `;
          feed.appendChild(postEl);
        });
      }
    });
  }

  window.likePost = (postId, btn) => {
    btn.classList.replace('fa-regular', 'fa-solid');
    const likesRef = ref(db, `posts/${postId}/likes`);
    get(likesRef).then((snap) => {
      const currentLikes = snap.val() || 0;
      set(likesRef, currentLikes + 1);
    });
  };

  // Story Likes System
  window.toggleStoryLike = () => {
    const btn = document.getElementById('storyLikeBtn');
    btn.classList.toggle('fa-solid');
    btn.classList.toggle('fa-regular');
  };

  // Switch Tab
  window.switchTab = (tabId, element) => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');

    if (element) {
      document.querySelectorAll('.nav-icon').forEach(icon => icon.classList.remove('active'));
      element.classList.add('active');
    }
  };

  window.saveProfile = () => {
    set(ref(db, `users_db/${currentUserId}/bio`), document.getElementById('bioInput').value)
      .then(() => alert('تم حفظ التغييرات!'));
  };
</script>
</body>
</html>
